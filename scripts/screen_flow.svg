<svg width="720" height="930" viewBox="0 0 720 930" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK JP, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="720" height="760" fill="#ffffff"/>

  <!-- タイトル -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">4-2. 画面遷移図</text>

  <!-- S01 トップ -->
  <rect x="260" y="44" width="200" height="52" rx="8" fill="#5B4FCF" stroke="#4a3fb8" stroke-width="1"/>
  <text x="360" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">S01 トップ</text>
  <text x="360" y="84" text-anchor="middle" font-size="11" fill="#ddd">はじめる／地図を見る</text>

  <!-- トップ → ログイン -->
  <line x1="310" y1="96" x2="150" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="192" y="122" text-anchor="middle" font-size="11" fill="#555">はじめる</text>

  <!-- トップ → S04マップ（地図を見る） -->
  <line x1="430" y1="96" x2="480" y2="338" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="210" text-anchor="start" font-size="11" fill="#555">地図を見る</text>

  <!-- S02 ログイン -->
  <rect x="40" y="160" width="200" height="52" rx="8" fill="#2563EB" stroke="#1d4ed8" stroke-width="1"/>
  <text x="140" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">S02 ログイン</text>
  <text x="140" y="200" text-anchor="middle" font-size="11" fill="#ddd">メール・パスワード</text>

  <!-- ログイン → 新規登録 -->
  <line x1="140" y1="212" x2="140" y2="252" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="94" y="234" text-anchor="middle" font-size="11" fill="#555">アカウント作成へ</text>

  <!-- S03 新規登録 -->
  <rect x="40" y="252" width="200" height="52" rx="8" fill="#2563EB" stroke="#1d4ed8" stroke-width="1"/>
  <text x="140" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">S03 新規登録</text>
  <text x="140" y="292" text-anchor="middle" font-size="11" fill="#ddd">メール・パスワード</text>

  <!-- ログイン・新規登録 → 合流 → S04マップ -->
  <line x1="240" y1="186" x2="294" y2="186" stroke="#555" stroke-width="1.5"/>
  <line x1="240" y1="278" x2="294" y2="278" stroke="#555" stroke-width="1.5"/>
  <line x1="294" y1="186" x2="294" y2="278" stroke="#555" stroke-width="1.5"/>
  <line x1="294" y1="232" x2="360" y2="232" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="318" y="222" text-anchor="middle" font-size="11" fill="#555">認証成功</text>
  <path d="M360 232 L440 232 L440 322" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 仕切り線 -->
  <line x1="20" y1="316" x2="700" y2="316" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="360" y="328" text-anchor="middle" font-size="11" fill="#888">ボトムナビ（認証不要）</text>

  <!-- S07 上人について -->
  <rect x="20" y="338" width="168" height="52" rx="8" fill="#0F766E" stroke="#0d6561" stroke-width="1"/>
  <text x="104" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">S07 上人について</text>
  <text x="104" y="378" text-anchor="middle" font-size="11" fill="#ddd">人物・行・文字</text>

  <!-- S05 スポット一覧 -->
  <rect x="204" y="338" width="168" height="52" rx="8" fill="#0F766E" stroke="#0d6561" stroke-width="1"/>
  <text x="288" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">S05 スポット一覧</text>
  <text x="288" y="378" text-anchor="middle" font-size="11" fill="#ddd">エリア絞込・検索</text>

  <!-- S04 マップ -->
  <rect x="388" y="338" width="168" height="52" rx="8" fill="#0F766E" stroke="#0d6561" stroke-width="1"/>
  <text x="472" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">S04 マップ</text>
  <text x="472" y="378" text-anchor="middle" font-size="11" fill="#ddd">ピン表示・詳細へ</text>

  <!-- S08 マイページ -->
  <rect x="572" y="338" width="128" height="52" rx="8" fill="#B45309" stroke="#9a4a08" stroke-width="1"/>
  <text x="636" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">S08 マイページ</text>
  <text x="636" y="378" text-anchor="middle" font-size="10" fill="#ffe">スタンプ・達成率</text>

  <!-- ※要ログイン -->
  <text x="636" y="402" text-anchor="middle" font-size="10" fill="#B45309">※要ログイン</text>

  <!-- サブ画面の仕切り -->
  <line x1="20" y1="414" x2="550" y2="414" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="240" y="426" text-anchor="middle" font-size="11" fill="#888">サブ画面（ボトムナビなし）</text>

  <!-- S05・S04 → S06スポット詳細 -->
  <line x1="288" y1="390" x2="240" y2="448" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="390" x2="350" y2="448" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- S06 スポット詳細 -->
  <rect x="110" y="448" width="290" height="52" rx="8" fill="#6B7280" stroke="#565c66" stroke-width="1"/>
  <text x="255" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">S06 スポット詳細</text>
  <text x="255" y="488" text-anchor="middle" font-size="11" fill="#ddd">名称・解説・アクセス・写真一覧</text>

  <!-- S08 → S09 -->
  <line x1="636" y1="408" x2="636" y2="448" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- S09 称号一覧 -->
  <rect x="562" y="448" width="148" height="52" rx="8" fill="#6B7280" stroke="#565c66" stroke-width="1"/>
  <text x="636" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">S09 称号一覧</text>
  <text x="636" y="488" text-anchor="middle" font-size="11" fill="#ddd">巡礼の道ビジュアル</text>

  <!-- スポット詳細 → チェックイン -->
  <line x1="255" y1="500" x2="255" y2="558" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="257" y="532" text-anchor="start" font-size="11" fill="#555">チェックイン（要ログイン）</text>

  <!-- チェックインフロー -->
  <rect x="110" y="558" width="290" height="68" rx="8" fill="#DC2626" stroke="#b91c1c" stroke-width="1"/>
  <text x="255" y="580" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">チェックインフロー</text>
  <text x="255" y="598" text-anchor="middle" font-size="11" fill="#fdd">撮影 or ライブラリ選択</text>
  <text x="255" y="614" text-anchor="middle" font-size="11" fill="#fdd">→ Storage保存 → スタンプ記録</text>

  <!-- チェックイン → S06スポット詳細（自動・破線） -->
  <path d="M400 592 L460 592 L460 474 L400 474" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
  <text x="468" y="548" text-anchor="start" font-size="11" fill="#888">スタンプ・称号付与</text>
  <text x="468" y="562" text-anchor="start" font-size="11" fill="#888">→ 元の画面に戻る</text>

  <!-- v2.0 追加フロー 区切り -->
  <line x1="20" y1="648" x2="700" y2="648" stroke="#bbb" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="360" y="662" text-anchor="middle" font-size="11" fill="#888">v2.1 追加フロー（管理者・申請）</text>

  <!-- 左側：ユーザー申請フロー -->
  <text x="150" y="682" text-anchor="middle" font-size="10" fill="#555">S04・S05の「申請」ボタンから</text>
  <line x1="150" y1="685" x2="150" y2="693" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- S12 スポット申請フォーム -->
  <rect x="40" y="695" width="220" height="52" rx="8" fill="#6B7280" stroke="#565c66" stroke-width="1"/>
  <text x="150" y="717" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">S12 スポット申請フォーム</text>
  <text x="150" y="735" text-anchor="middle" font-size="10" fill="#ddd">GPS・写真・スポット情報入力</text>

  <!-- 右側：管理者フロー -->
  <text x="602" y="682" text-anchor="middle" font-size="10" fill="#555">S08マイページから（管理者のみ）</text>
  <line x1="602" y1="685" x2="602" y2="693" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- S10 管理ページ -->
  <rect x="505" y="695" width="195" height="52" rx="8" fill="#B45309" stroke="#9a4a08" stroke-width="1"/>
  <text x="602" y="717" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">S10 管理ページ</text>
  <text x="602" y="735" text-anchor="middle" font-size="10" fill="#ffe">スポット管理・削除・承認待ち</text>

  <!-- S10 → S11 -->
  <line x1="602" y1="747" x2="602" y2="773" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="634" y="763" text-anchor="start" font-size="10" fill="#555">スポット選択</text>

  <!-- S11 スポット編集 -->
  <rect x="505" y="775" width="195" height="52" rx="8" fill="#6B7280" stroke="#565c66" stroke-width="1"/>
  <text x="602" y="797" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">S11 スポット編集</text>
  <text x="602" y="815" text-anchor="middle" font-size="10" fill="#ddd">所在地・解説・場所等を編集</text>

  <!-- S10 → S13 新規追加 -->
  <line x1="553" y1="747" x2="490" y2="773" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="508" y="754" text-anchor="middle" font-size="10" fill="#555">新規追加</text>

  <!-- S13 スポット新規追加 -->
  <rect x="280" y="773" width="210" height="52" rx="8" fill="#6B7280" stroke="#565c66" stroke-width="1"/>
  <text x="385" y="795" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">S13 スポット新規追加</text>
  <text x="385" y="813" text-anchor="middle" font-size="10" fill="#ddd">項目入力・保存</text>

  <!-- 凡例（移動） -->
  <rect x="20" y="868" width="14" height="12" rx="2" fill="#5B4FCF"/>
  <text x="40" y="878" font-size="11" fill="#444">入口</text>
  <rect x="80" y="868" width="14" height="12" rx="2" fill="#2563EB"/>
  <text x="100" y="878" font-size="11" fill="#444">認証</text>
  <rect x="148" y="868" width="14" height="12" rx="2" fill="#0F766E"/>
  <text x="168" y="878" font-size="11" fill="#444">ボトムナビ</text>
  <rect x="258" y="868" width="14" height="12" rx="2" fill="#B45309"/>
  <text x="278" y="878" font-size="11" fill="#444">要ログイン</text>
  <rect x="368" y="868" width="14" height="12" rx="2" fill="#6B7280"/>
  <text x="388" y="878" font-size="11" fill="#444">サブ画面</text>
  <rect x="456" y="868" width="14" height="12" rx="2" fill="#DC2626"/>
  <text x="476" y="878" font-size="11" fill="#444">アクション</text>
  <line x1="548" y1="874" x2="574" y2="874" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="580" y="878" font-size="11" fill="#444">自動遷移</text>
</svg>
